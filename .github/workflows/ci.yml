name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -e .[dev] gymnasium
      - name: lint
        run: ruff check .
      - name: format
        run: ruff format --check .
      - name: typecheck
        run: mypy bioafferent
      - name: tests
        run: pytest tests/ -q --ignore=tests/performance
      - name: build
        run: |
          pip install build
          python -m build
