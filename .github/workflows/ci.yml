name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          pip install -e ".[dev,gymnasium,mujoco]"
      - name: lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: format
        if: matrix.python-version == '3.11'
        run: ruff format --check .
      - name: typecheck
        if: matrix.python-version == '3.11'
        run: mypy bioafferent
      - name: tests
        run: pytest tests/ -q --ignore=tests/performance
      - name: build
        run: |
          pip install build
          python -m build
